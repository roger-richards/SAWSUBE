name: Build and push ARMv7 image

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-cache-${{ github.sha }}
          restore-keys: |
            buildx-cache-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          # Tag by git tag if present, otherwise use branch and short SHA
          if [ -n "${GITHUB_REF##refs/tags/}" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "ref_type=tag" >> $GITHUB_OUTPUT
          else
            BRANCH=${GITHUB_REF#refs/heads/}
            SHORT_SHA=$(git rev-parse --short=12 HEAD)
            echo "tag=${BRANCH}-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "ref_type=branch" >> $GITHUB_OUTPUT
          fi
          echo "latest_tag=latest" >> $GITHUB_OUTPUT

      - name: Build and push image for linux/arm/v7
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            yourdockerhubuser/sawsub8:${{ steps.tags.outputs.tag }}
            yourdockerhubuser/sawsub8:${{ steps.tags.outputs.latest_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Verify pushed tags
        run: |
          echo "Pushed tags: ${{ steps.tags.outputs.tag }}, ${{ steps.tags.outputs.latest_tag }}"
